<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2418;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a170e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0c040;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#d4a017" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a170e">LAWYER PASS</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#332d1a" stroke="#d4a017" stroke-width="1"/>
  <circle cx="64" cy="102" r="12" fill="#5a4e2d"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#5a4e2d"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#5a4e2d"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#332d1a"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#332d1a"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#332d1a"/>
  <!-- Gavel icon -->
  <g transform="translate(178, 172)" fill="#d4a017" opacity="0.5">
    <rect x="-15" y="-12" width="30" height="10" rx="3" transform="rotate(-30, 0, -7)"/>
    <rect x="-2" y="-5" width="4" height="20" rx="1"/>
    <rect x="-12" y="14" width="24" height="5" rx="2"/>
  </g>
  <!-- Bottom bar -->
  <rect x="38" y="168" width="110" height="6" rx="3" fill="#332d1a"/>
  <rect x="38" y="182" width="80" height="6" rx="3" fill="#332d1a"/>
</svg>
