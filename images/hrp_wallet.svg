<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="walletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3728;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2e1f14;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="walletInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a1c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#241810;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0c040;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Wallet body (outer) -->
  <rect x="35" y="55" width="180" height="140" rx="10" ry="10" fill="url(#walletBg)" stroke="#5a4030" stroke-width="2"/>
  <!-- Leather texture lines -->
  <line x1="45" y1="75" x2="205" y2="75" stroke="#3a2a1c" stroke-width="0.5" opacity="0.5"/>
  <line x1="45" y1="95" x2="205" y2="95" stroke="#3a2a1c" stroke-width="0.5" opacity="0.5"/>
  <!-- Wallet fold line -->
  <rect x="35" y="120" width="180" height="3" rx="1" fill="#241810" opacity="0.6"/>
  <!-- Top card peeking out -->
  <rect x="50" y="48" width="100" height="20" rx="4" fill="#1a2a4a" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <rect x="58" y="53" width="40" height="4" rx="2" fill="#3b82f6" opacity="0.5"/>
  <!-- Second card peeking -->
  <rect x="70" y="42" width="90" height="16" rx="4" fill="#1a2e1a" stroke="#22c55e" stroke-width="0.8" opacity="0.5"/>
  <!-- Wallet inner section -->
  <rect x="45" y="128" width="160" height="55" rx="6" fill="url(#walletInner)"/>
  <!-- Card slots inside -->
  <rect x="55" y="135" width="65" height="38" rx="3" fill="#1a1a2e" opacity="0.4" stroke="#5a4a3a" stroke-width="0.5"/>
  <rect x="130" y="135" width="65" height="38" rx="3" fill="#1a1a2e" opacity="0.4" stroke="#5a4a3a" stroke-width="0.5"/>
  <!-- Clasp/button -->
  <circle cx="215" cy="125" r="8" fill="url(#gold)" stroke="#b8860b" stroke-width="1"/>
  <circle cx="215" cy="125" r="4" fill="#b8860b"/>
  <!-- Stitching detail -->
  <rect x="38" y="58" width="174" height="134" rx="8" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
</svg>
