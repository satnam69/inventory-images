<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1a20;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">DRIVING LICENSE - CAR</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#0e2a33" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="64" cy="102" r="12" fill="#1a4a5a"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#1a4a5a"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#1a4a5a"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#0e2a33"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#0e2a33"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#0e2a33"/>
  <!-- Car icon -->
  <g transform="translate(175, 165)" fill="#06b6d4" opacity="0.5">
    <rect x="-20" y="0" width="40" height="15" rx="5"/>
    <rect x="-15" y="-9" width="30" height="13" rx="4"/>
    <circle cx="-11" cy="17" r="5" fill="#0a1a20" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="11" cy="17" r="5" fill="#0a1a20" stroke="#06b6d4" stroke-width="1.5"/>
  </g>
  <!-- Category badge -->
  <rect x="38" y="160" width="30" height="16" rx="4" fill="#06b6d4" opacity="0.3"/>
  <text x="53" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#06b6d4">CAR</text>
  <!-- Bottom bar -->
  <rect x="38" y="182" width="80" height="6" rx="3" fill="#0e2a33"/>
</svg>
