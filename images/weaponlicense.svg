<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1f0d0d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">WEAPON LICENSE</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#3a1a1a" stroke="#ef4444" stroke-width="1"/>
  <circle cx="64" cy="102" r="12" fill="#6e2d2d"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#6e2d2d"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#6e2d2d"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#3a1a1a"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#3a1a1a"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#3a1a1a"/>
  <!-- Gun icon -->
  <g transform="translate(180, 170)" fill="#ef4444" opacity="0.5">
    <rect x="-22" y="-4" width="35" height="9" rx="2"/>
    <rect x="-22" y="-8" width="10" height="5" rx="1"/>
    <rect x="5" y="3" width="5" height="14" rx="1" transform="rotate(-10, 5, 3)"/>
    <rect x="-7" y="3" width="5" height="10" rx="1"/>
  </g>
  <!-- Bottom bar -->
  <rect x="38" y="168" width="110" height="6" rx="3" fill="#3a1a1a"/>
  <rect x="38" y="182" width="80" height="6" rx="3" fill="#3a1a1a"/>
</svg>
