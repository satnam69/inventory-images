<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1f0d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">DRIVER LICENSE</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#1a3a1a" stroke="#22c55e" stroke-width="1"/>
  <circle cx="64" cy="102" r="12" fill="#2d6e2d"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#2d6e2d"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#2d6e2d"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#1a3a1a"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#1a3a1a"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#1a3a1a"/>
  <!-- Car icon -->
  <g transform="translate(175, 160)" fill="#22c55e" opacity="0.5">
    <rect x="-18" y="0" width="36" height="14" rx="5" />
    <rect x="-14" y="-8" width="28" height="12" rx="4" />
    <circle cx="-10" cy="16" r="5" fill="#0d1f0d" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="10" cy="16" r="5" fill="#0d1f0d" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <!-- Bottom bar -->
  <rect x="38" y="168" width="110" height="6" rx="3" fill="#1a3a1a"/>
  <rect x="38" y="182" width="80" height="6" rx="3" fill="#1a3a1a"/>
</svg>
