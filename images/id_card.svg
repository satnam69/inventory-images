<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1b2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">IDENTITY CARD</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <!-- Person silhouette -->
  <circle cx="64" cy="102" r="12" fill="#2d5a8e"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#2d5a8e"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#2d5a8e"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#1e3a5f"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#1e3a5f"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#1e3a5f"/>
  <!-- Bottom bar -->
  <rect x="38" y="162" width="175" height="6" rx="3" fill="#1e3a5f"/>
  <rect x="38" y="176" width="130" height="6" rx="3" fill="#1e3a5f"/>
  <!-- ID icon bottom right -->
  <text x="200" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" opacity="0.6">ID</text>
</svg>
