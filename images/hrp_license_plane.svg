<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#141422;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e1e2e">PILOT LICENSE</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#2a2a3e" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="64" cy="102" r="12" fill="#4a4a6a"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#4a4a6a"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#4a4a6a"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#2a2a3e"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#2a2a3e"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#2a2a3e"/>
  <!-- Plane icon -->
  <g transform="translate(178, 172)" fill="#f59e0b" opacity="0.5">
    <ellipse cx="0" cy="0" rx="5" ry="16" transform="rotate(45)"/>
    <rect x="-18" y="-3" width="36" height="6" rx="3" transform="rotate(45)"/>
    <rect x="5" y="8" width="14" height="5" rx="2" transform="rotate(45)"/>
  </g>
  <!-- Category badge -->
  <rect x="38" y="160" width="48" height="16" rx="4" fill="#f59e0b" opacity="0.3"/>
  <text x="62" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#f59e0b">PLANE</text>
  <rect x="38" y="182" width="80" height="6" rx="3" fill="#2a2a3e"/>
</svg>
