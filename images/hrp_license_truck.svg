<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10102a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Card body -->
  <rect x="20" y="45" width="210" height="160" rx="12" ry="12" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- Top accent bar -->
  <rect x="20" y="45" width="210" height="28" rx="12" ry="12" fill="url(#accent)"/>
  <rect x="20" y="61" width="210" height="12" fill="url(#accent)"/>
  <!-- Header text -->
  <text x="125" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">DRIVING LICENSE - TRUCK</text>
  <!-- Photo placeholder -->
  <rect x="38" y="85" width="52" height="62" rx="4" fill="#1e1e3a" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="64" cy="102" r="12" fill="#3a3a6e"/>
  <ellipse cx="64" cy="132" rx="18" ry="12" fill="#3a3a6e"/>
  <!-- Info lines -->
  <rect x="105" y="90" width="108" height="8" rx="3" fill="#3a3a6e"/>
  <rect x="105" y="106" width="85" height="8" rx="3" fill="#1e1e3a"/>
  <rect x="105" y="122" width="95" height="8" rx="3" fill="#1e1e3a"/>
  <rect x="105" y="138" width="70" height="8" rx="3" fill="#1e1e3a"/>
  <!-- Truck icon -->
  <g transform="translate(175, 163)" fill="#8b5cf6" opacity="0.5">
    <rect x="-22" y="-2" width="26" height="18" rx="3"/>
    <rect x="4" y="4" width="16" height="12" rx="2"/>
    <rect x="6" y="5" width="12" height="8" rx="1" fill="#10102a" opacity="0.5"/>
    <circle cx="-12" cy="19" r="5" fill="#10102a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="12" cy="19" r="5" fill="#10102a" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <!-- Category badge -->
  <rect x="38" y="160" width="42" height="16" rx="4" fill="#8b5cf6" opacity="0.3"/>
  <text x="59" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#8b5cf6">TRUCK</text>
  <rect x="38" y="182" width="80" height="6" rx="3" fill="#1e1e3a"/>
</svg>
